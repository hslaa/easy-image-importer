name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds and tests; the 9.0 runtime runs the net9.0 targets.
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
